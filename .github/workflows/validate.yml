name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same pull request cancels the older run; runs on a branch always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    strategy:
      # macOS runners are few and shared by every repository, so a pull request
      # checks Linux and Windows and main adds macOS.
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate collection
        shell: pwsh
        run: ./scripts/validate-skills.ps1
      - name: Validate behavioral eval fixtures
        shell: pwsh
        run: ./scripts/validate-evals.ps1
      - name: Test installer tooling
        shell: pwsh
        run: ./scripts/test-tooling.ps1
