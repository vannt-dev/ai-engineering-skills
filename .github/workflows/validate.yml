name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate collection
        shell: pwsh
        run: ./scripts/validate-skills.ps1
      - name: Validate behavioral eval fixtures
        shell: pwsh
        run: ./scripts/validate-evals.ps1
      - name: Test installer tooling
        shell: pwsh
        run: ./scripts/test-tooling.ps1
