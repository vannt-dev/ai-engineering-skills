name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate collection
        shell: pwsh
        run: ./scripts/validate-skills.ps1
      - name: Validate behavioral eval fixtures
        shell: pwsh
        run: ./scripts/validate-evals.ps1
      - name: Test installer tooling
        shell: pwsh
        run: ./scripts/test-tooling.ps1
